spring.datasource.url=jdbc:h2:mem:workshop;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test-secret-key-for-jwt-signing-which-is-at-least-32-bytes
app.jwt.expiration-ms=3600000

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.ai.openai.api-key=key-test

