# ============================================================
#  vehicle-workshop-service — configuration
#  Secrets via variables d'environnement (jamais commites).
#  Les valeurs apres ":" sont des defauts de developpement local.
# ============================================================

spring.application.name=vehicle-workshop-service
server.port=${SERVER_PORT:8080}

# ---------- Base de donnees PostgreSQL ----------
# Base : vehicleworkshop_db (projet agentic).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/vehicleworkshop_db}
spring.datasource.username=${DATABASE_USER:workshop_user}
spring.datasource.password=${DATABASE_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
# update = cree/met a jour le schema au demarrage (dev). En prod : validate + migrations.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT (module auth) ----------
# Genere une cle robuste (>= 256 bits) et mets-la dans JWT_SECRET.
# Ne jamais commiter la vraie cle. Ne jamais renvoyer le token en reponse metier.
app.jwt.secret=${JWT_SECRET:change-me-in-env-a-very-long-random-secret-key-at-least-256-bits-long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---------- Swagger / OpenAPI (Springdoc) ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info

