spring.application.name=vehicle-service
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/workshop_db
spring.datasource.username=workshop_user
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---------- JWT (module auth) ----------
# Genere une cle robuste (>= 256 bits) et mets-la dans JWT_SECRET.
# Ne jamais commiter la vraie cle. Ne jamais renvoyer le token en reponse metier.
app.jwt.secret=${JWT_SECRET:change-me-in-env-a-very-long-random-secret-key-at-least-256-bits-long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
